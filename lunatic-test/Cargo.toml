[package]
name = "lunatic-test-twitchax-patch"
version = "0.13.1"
edition = "2021"
authors = ["Bernard Kolobara <bernard@lunatic.solutions>"]
description = "#[lunatic::test] macro, meant as a drop-in replacement for Rust's #[test]"
license = "Apache-2.0/MIT"
repository = "https://github.com/twitchax/lunatic-rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
quote = "1"
syn = { version = "3", features = ["full", "extra-traits"] }

[dev-dependencies]
lunatic = { package = "lunatic-twitchax-patch", path = "..", features = ["json_serializer", "msgpack_serializer"] }

# Published as `lunatic-test-twitchax-patch`, but imported as `lunatic_test`.
[lib]
name = "lunatic_test"
proc-macro = true