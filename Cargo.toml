[package]
name = "lunatic-twitchax-patch"
version = "0.15.0"
edition = "2021"
authors = ["Bernard Kolobara <bernard@lunatic.solutions>"]
description = "Helper library for building Rust applications that run on lunatic."
license = "Apache-2.0/MIT"
readme = "Readme.md"
repository = "https://github.com/twitchax/lunatic-rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Published as `lunatic-twitchax-patch`, but imported as `lunatic`, which the macros' generated code relies on.
[lib]
name = "lunatic"

[features]
default = []
json_serializer = ["serde_json"]
msgpack_serializer = ["rmp-serde"]
protobuf_serializer = ["protobuf"]
sqlite = ["lunatic-sqlite-api"]

[dependencies]
thiserror = "2.0"
rustversion = "1.0"
paste = "1.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
serde_json = { version = "1.0", optional = true }
rmp-serde = { version = "1.3", optional = true }
protobuf = { version = "3.7", optional = true }
lunatic-sqlite-api = { version = "0.13", optional = true }
lunatic-macros = { package = "lunatic-macros-twitchax-patch", version = "0.13.1", path = "./lunatic-macros" }
lunatic-test = { package = "lunatic-test-twitchax-patch", version = "0.13.1", path = "./lunatic-test" }
lunatic-sys = { version = "0.14", path = "./lunatic-sys" }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
serde_bytes = "0.11"
lunatic = { package = "lunatic-twitchax-patch", path = ".", features = ["json_serializer", "msgpack_serializer"] }

[[bench]]
name = "serializer"
harness = false

[[bench]]
name = "spawning"
harness = false

[[test]]
name = "sqlite"
path = "tests/sqlite.rs"
required-features = ["sqlite"]

# Needs a second node, so `tests/distributed/run.sh` runs it on a cluster.
[[example]]
name = "distributed_checks"
path = "tests/distributed/guest.rs"

[workspace]
members = ["lunatic-macros", "lunatic-test", "lunatic-sys"]

[package.metadata.docs.rs]
targets = ["wasm32-wasip1"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
